apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: denovo-dspark-test-eval-20261104-r7
  namespace: qiji
  annotations:
    JobAlias: denovo-dspark-test-eval-20261104-r7
    project: WeaverRSI
spec:
  minAvailable: 1
  schedulerName: volcano
  queue: proj-32
  tasks:
  - replicas: 1
    name: worker
    template:
      spec:
        restartPolicy: Never
        activeDeadlineSeconds: 86400
        tolerations:
        - key: task-type
          operator: Equal
          value: rsi-weaver
          effect: NoSchedule
        - key: task-type
          operator: Equal
          value: weaver
          effect: NoSchedule
        volumes:
        - name: gpfs
          hostPath:
            path: /gpfs
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: task
          hostPath:
            path: /gpfs/users/linlizhi/dspark-test-20261104-r7
            type: Directory
        - name: runtime
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: host-ctr
          hostPath:
            path: /usr/bin/ctr
            type: File
        - name: host-crictl
          hostPath:
            path: /usr/bin/crictl
            type: File
        - name: host-snapshotter
          hostPath:
            path: /data/var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
