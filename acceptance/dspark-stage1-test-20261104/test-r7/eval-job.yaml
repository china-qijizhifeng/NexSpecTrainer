          - name: host-snapshotter
            mountPath: /host-snapshotter
            readOnly: true
          - name: task
            mountPath: /gpfs/users/linlizhi/dspark-test-20261104-r7
          - name: archive
            mountPath: /gpfs/users/linlizhi/nexspec-v41-capture-20261103/offline-image
            readOnly: true
