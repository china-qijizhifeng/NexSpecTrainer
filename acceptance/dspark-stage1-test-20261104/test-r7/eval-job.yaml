          imagePullPolicy: Never
          resources:
            requests:
              cpu: '64'
              memory: 512Gi
              nvidia.com/gpu: '8'
            limits:
              cpu: '64'
              memory: 512Gi
              nvidia.com/gpu: '8'
          command:
          - /bin/bash
          - /gpfs/users/linlizhi/dspark-test-20261104-r7/run_eval.sh
          volumeMounts:
          - name: gpfs
            mountPath: /gpfs
          - name: shm
            mountPath: /dev/shm
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        nodeSelector:
          node_shcheduleable: 'true'
        initContainers:
        - name: import-verified-serving-image
          image: harbor.local.clusters/bp/weaver-trainer-megatron-bridge:v1.14.92@sha256:cba116d15f4be378c467a5d15157b69e3307e21c3c67342a06481f8f4a1187df
