apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: denovo-dspark-test-eval-20261104-r4
  namespace: qiji
  annotations:
    JobAlias: denovo-dspark-test-eval-20261104-r4
    project: WeaverRSI
spec:
  minAvailable: 1
  schedulerName: volcano
  queue: proj-32
  tasks:
  - replicas: 1
    name: worker
    template:
      spec:
        restartPolicy: Never
        activeDeadlineSeconds: 86400
