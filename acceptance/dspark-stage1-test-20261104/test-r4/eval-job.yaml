              cpu: '64'
              memory: 768Gi
              nvidia.com/gpu: '8'
          command:
          - /bin/bash
          - /gpfs/users/linlizhi/dspark-test-20261104-r4/run_eval.sh
          volumeMounts:
          - name: gpfs
            mountPath: /gpfs
          - name: shm
            mountPath: /dev/shm
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        nodeSelector:
          kubernetes.io/hostname: node040
