# Candidate recipe; full-checkpoint GPU acceptance is still required.
model:
  target_model_path: /models/DeepSeek-V4.1-Flash-1017
  draft_model_config: configs/deepseek-v41-flash-native.json
  target_backend: sglang
  embedding_key: embed.weight
  lm_head_key: head.weight
  torch_dtype: bfloat16
  use_liger_kernel: false

data:
  hidden_states_path: ./cache/hidden_states/deepseek-v41-flash-native
  max_length: 4096
  cache_dir: ./cache

training:
  nfc_checkpoint: {}
  strategy: deepseek_v41
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  batch_size: 1
  accumulation_steps: 16
  num_epochs: 1
  learning_rate: 1.0e-5
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  attention_backend: megatron_csa
  num_anchors: 32
  objective_chunk_blocks: 8
  objective_checkpointing: true
  loss_decay_gamma: 4.0
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 100
  log_interval: 10
  dist_timeout: 30
  seed: 42

run_id: deepseek-v41-native-offline
output_dir: ./outputs/deepseek-v41-native-offline

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 8
