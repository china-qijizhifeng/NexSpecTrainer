# Candidate recipe; use a separate, pinned V4.1 SGLang capture environment.
model:
  target_model_path: /models/DeepSeek-V4.1-Flash-1017
  draft_model_config: configs/deepseek-v41-flash-native.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: embed.weight
  lm_head_key: head.weight
  mask_token_id: 128799
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.85
  sglang_context_length: 8704
  sglang_max_running_requests: 8
  sglang_moe_runner_backend: flashinfer_mxfp4
  use_liger_kernel: false
data:
  prompts_path: ./cache/dataset/deepseek-v41-tokenized.jsonl
  max_length: 4096
  cache_dir: cache
  dataloader_num_workers: 2
training:
  strategy: deepseek_v41
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  batch_size: 1
  accumulation_steps: 16
  num_epochs: 1
  learning_rate: 1.0e-05
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  attention_backend: megatron_csa
  num_anchors: 32
  objective_chunk_blocks: 8
  objective_checkpointing: true
  loss_decay_gamma: 4.0
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 100
  log_interval: 10
  dist_timeout: 30
  seed: 42
runtime:
  producer_lease: 8
  producer_concurrency: 8
  in_flight_high_watermark: 256
  in_flight_low_watermark: 128
  resident_high_watermark_bytes: 137438953472
  resident_low_watermark_bytes: 103079215104
  feature_store_max_resident_bytes: 171798691840
run_id: deepseek-v41-native-online
output_dir: outputs/deepseek-v41-native-online
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/deepseek-v41-native-disaggregated/control
    consumer_state_dir: outputs/deepseek-v41-native-disaggregated/consumer-state
    backend: mooncake
    store_id: deepseek-v41-native-specforge-disaggregated
    server_urls:
    - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
    server_capture: plugin
